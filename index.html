<title>Le Loisir du Matin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=EB+Garamond:ital,wght@0,400..600;1,400..500&family=GFS+Didot&display=swap">
<style>
/* Layout: a pocket edition. One rubric per screen, a running head above, five tabs below; ink plus one spot colour, as on a two-colour press. */
:root{
  --paper:#eceae3; --ink:#1c1b18; --ink-soft:#57544b; --rule:#1c1b18; --hair:#bdb9ac; --spot:#1f4a3a; --wash:#e0ddd2;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --text:"EB Garamond","Garamond","Adobe Garamond Pro",Georgia,serif;
  --greek:"GFS Didot","EB Garamond","Times New Roman",serif;
  --bar:3.4rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#17181a;--ink:#e3dfd3;--ink-soft:#a5a194;--rule:#e3dfd3;--hair:#48484a;--spot:#9cc7b1;--wash:#222326;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#17181a;--ink:#e3dfd3;--ink-soft:#a5a194;--rule:#e3dfd3;--hair:#48484a;--spot:#9cc7b1;--wash:#222326;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.18rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--bar) + env(safe-area-inset-bottom,0px) + 2.5rem);
  font-variant-numeric:oldstyle-nums;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.sheet{max-width:36rem;margin:0 auto}
p{margin:0}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.label{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:lining-nums;color:var(--ink-soft)}
.how{font-style:italic;color:var(--ink-soft);font-size:1rem}

.running{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  border-bottom:1px solid var(--rule);padding-block:.55rem .45rem;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:lining-nums}
.running b{font-family:var(--display);font-weight:500;letter-spacing:.02em;text-transform:none;font-size:1rem}
.running span{color:var(--ink-soft);white-space:nowrap}

.mast{text-align:center;border-bottom:3px double var(--rule);padding-block:1.6rem .8rem}
.mast h1{font-family:var(--display);font-size:clamp(2.5rem,12vw,4rem);line-height:.98;letter-spacing:-.01em}
.mast .sub{font-style:italic;color:var(--ink-soft);margin-top:.6rem;font-size:1rem}
.mast .date{margin-top:.9rem;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;font-variant-numeric:lining-nums}
.mast .roman{font-style:italic;color:var(--ink-soft);margin-top:.2rem;font-size:.98rem}

.strip{display:grid;grid-template-columns:1fr;gap:1rem;border-bottom:1px solid var(--rule);padding-block:.9rem}
.strip table{width:100%;border-collapse:collapse;font-size:1rem;margin-top:.25rem}
.strip td{padding:.12rem 0;vertical-align:baseline}
.strip td.n{text-align:right;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;padding-left:.7rem}
.strip td.s{font-style:italic;color:var(--ink-soft);padding-left:.7rem}
@media (min-width:34rem){.strip{grid-template-columns:1fr 1fr;gap:2rem}}

.sommaire{border-bottom:1px solid var(--rule);padding-block:.9rem}
.sommaire ol{list-style:none;margin:.3rem 0 0;padding:0}
.sommaire a{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;text-decoration:none;padding:.42rem 0;border-top:1px solid var(--hair)}
.sommaire li:first-child a{border-top:0}
.sommaire .t{font-family:var(--display);font-size:1.12rem}
.sommaire .l{font-style:italic;color:var(--ink-soft);font-size:.95rem;white-space:nowrap}
.sommaire a.seen .t::after{content:" ✓";color:var(--spot);font-family:var(--text);font-size:.9rem}

.vhead{text-align:center;padding-block:1.6rem 1.1rem}
.vhead h2{font-family:var(--display);font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.08;margin-top:.4rem}
.deck{font-style:italic;font-size:1.16rem;line-height:1.4;color:var(--ink-soft);text-align:center;margin-bottom:1.3rem}

.brief{padding-block:1.1rem;border-top:1px solid var(--hair)}
.brief:first-of-type{border-top:0;padding-top:.2rem}
.brief h3{font-family:var(--display);font-size:1.42rem;line-height:1.14;margin:.2rem 0 .4rem}
.body p{text-indent:1.3em;hyphens:auto}
.body p:first-child{text-indent:0}
.body.cap p:first-child::first-letter{font-family:var(--display);font-size:3.2em;float:left;line-height:.82;padding:.06em .09em 0 0}

.seg{display:flex;border:1px solid var(--rule);margin-top:1.1rem}
.seg a{flex:1;text-align:center;text-decoration:none;padding:.55rem .2rem;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;border-left:1px solid var(--rule);min-width:0}
.seg a:first-child{border-left:0}
.seg a[aria-current="true"]{background:var(--ink);color:var(--paper)}

.piece{padding-block:1.1rem;border-top:1px solid var(--hair)}
.piece:first-child{border-top:0;padding-top:0}
.piece h3{font-family:var(--display);font-size:1.42rem;line-height:1.14;margin-bottom:.4rem}
.piece h3 small{display:block;font-family:var(--text);font-style:italic;font-size:1rem;color:var(--ink-soft);margin-top:.15rem}
.piece p+p{text-indent:1.3em}
.w{cursor:pointer;padding-block:.12em}
.w.on{color:var(--spot);border-bottom:1px solid var(--spot)}
.w.now{background:var(--wash)}

.ask{margin-top:1.5rem;border-top:1px solid var(--rule);padding-top:.9rem}
.ask .q{font-style:italic;font-size:1.2rem;margin-top:.2rem}
textarea,input[type=text]{display:block;width:100%;box-sizing:border-box;background:transparent;color:var(--ink);font:inherit;border:0;border-radius:0;padding:0}
textarea{margin-top:.7rem;line-height:1.6;border-bottom:1px solid var(--hair);background-image:repeating-linear-gradient(transparent,transparent calc(1.6em - 1px),var(--hair) calc(1.6em - 1px),var(--hair) 1.6em);background-attachment:local;resize:vertical}
input[type=text]{border-bottom:1px solid var(--rule);padding:.3rem 0;margin-top:.3rem}
textarea:focus,input[type=text]:focus{outline:none;border-bottom-color:var(--spot)}
button.act{font:inherit;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:.8rem 1.1rem;margin-top:1rem;cursor:pointer;border-radius:0;width:100%}
button.act:disabled{opacity:.45;cursor:default}
.reply{margin-top:1rem;white-space:pre-wrap}
.reply.err{font-style:italic;color:var(--ink-soft)}
details{margin-top:1rem;font-size:1.02rem}
summary{cursor:pointer;font-style:italic;color:var(--ink-soft);padding-block:.3rem}

.gr{font-family:var(--greek);font-size:1.45rem;line-height:1.45;font-variant-numeric:normal}
.sentence{padding-block:1.2rem;border-top:1px solid var(--rule)}
.sentence .tr{font-style:italic;color:var(--ink-soft);margin:.15rem 0 .7rem}
.pw{display:grid;grid-template-columns:minmax(6.2rem,auto) 1fr;gap:.05rem .9rem;padding-block:.45rem;border-top:1px solid var(--hair);font-size:1rem;line-height:1.35}
.pw .g{font-family:var(--greek);font-size:1.15rem;grid-row:span 3}
.pw .lem{font-family:var(--greek);color:var(--ink-soft)}
.pw .se{font-style:italic}
.dag{color:var(--spot)}
.fnote{font-size:1rem;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:.8rem}
.anchor{border-block:1px solid var(--rule);padding-block:1.2rem;margin-top:1.4rem;text-align:center}
.anchor .ref{margin-top:.5rem}
.anchor .tr{font-style:italic;margin-top:.6rem}
.anchor .nb{font-size:1rem;color:var(--ink-soft);margin-top:.7rem;text-align:left}
.modern{margin-top:1.6rem}
.modern .orig{font-style:italic;font-size:1.2rem;text-align:center;margin-top:.4rem;text-wrap:balance}
.modern .who{text-align:center;margin-top:.3rem}
.modern .gr{text-align:center;margin-block:.9rem .6rem}

.sujet{border-block:1px solid var(--rule);padding-block:1rem;margin-top:1.8rem;text-align:center}
.sujet p{font-style:italic;font-size:1.18rem;text-wrap:balance;margin-top:.3rem}
.corr{margin-top:1.2rem}
.corr .fixed{border-left:2px solid var(--spot);padding-left:.9rem;margin-top:.3rem}
.rem{border-top:1px solid var(--hair);padding-block:.55rem;font-size:1rem}
.rem s{color:var(--ink-soft)}
.rem i{display:block;color:var(--ink-soft)}
.grade{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--spot);margin-top:1.1rem}
.grade small{font-size:1rem;color:var(--ink-soft);font-family:var(--text);font-style:italic}
.appr{margin-top:.5rem;font-style:italic}

.cab{padding-block:1.3rem;border-top:1px solid var(--rule)}
.cab:first-of-type{border-top:0;padding-top:0}
.hw{font-family:var(--display);font-size:2.1rem;line-height:1.1;margin-top:.2rem}
.nat{font-style:italic;color:var(--ink-soft);font-size:1rem}
.ety{font-size:1rem;color:var(--ink-soft);margin-top:.4rem}
blockquote{margin:.7rem 0 0;padding-left:.9rem;border-left:1px solid var(--rule);font-style:italic}
blockquote .att{font-size:.95rem;color:var(--ink-soft);margin-top:.35rem;font-style:normal}
.verse{font-size:1.25rem;line-height:1.35}
.eph{margin:.5rem 0 0;display:grid;grid-template-columns:auto 1fr;gap:.4rem .9rem}
.eph dt{font-family:var(--display);font-variant-numeric:lining-nums;font-size:1.15rem}
.eph dd{margin:0}
.cab h3{font-family:var(--display);font-size:1.5rem;line-height:1.14;margin:.25rem 0 .4rem}
.cab h3 small{display:block;font-family:var(--text);font-style:italic;font-size:1rem;color:var(--ink-soft)}
.cab .item+.item{margin-top:.9rem}
.cab .item b{font-weight:500;font-family:var(--display);font-size:1.12rem}
.caveat{font-size:.92rem;font-style:italic;color:var(--ink-soft);margin-top:.5rem}
.shelf dl{margin:0}
.shelf dt{font-family:var(--display);font-size:1.18rem;margin-top:.8rem}
.shelf dt span{font-family:var(--text);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-left:.5rem}
.shelf dd{margin:0}
.more{display:block;text-decoration:none;font-style:italic;margin-top:.4rem}

.words{list-style:none;padding:0;margin:0}
.words li{padding-block:.5rem;border-top:1px solid var(--hair)}
.words li:first-child{border-top:0}
.words b{font-weight:500;font-family:var(--display);font-size:1.12rem}
.words i{color:var(--ink-soft);font-size:.92rem}

.frontis{display:block;text-decoration:none;text-align:center;border-bottom:1px solid var(--rule);padding-block:1rem}
.frontis img,.plate img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:var(--wash);margin-bottom:.7rem}
.frontis .t{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.15;margin-top:.2rem}
.frontis .l{display:block;font-style:italic;color:var(--ink-soft);font-size:1rem}
.plate{margin:0}
.plate figcaption{font-size:.98rem;color:var(--ink-soft);font-style:italic;text-align:center;margin-bottom:1.2rem}
.lead{padding-block:1.4rem 1.2rem;border-bottom:1px solid var(--rule)}
.lead h2{font-family:var(--display);font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.08;margin:.3rem 0 .6rem}
.lead .deck{text-align:left;margin-bottom:.9rem}
.aside{border-left:2px solid var(--spot);padding-left:.9rem;margin-top:1.1rem}
.aside p{font-size:1.06rem;margin:.15rem 0 .7rem}
.tour dl{margin:.5rem 0 0}
.tour dt{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--spot);margin-top:.7rem}
.tour dd{margin:0}
.blk{padding-block:1.3rem 0;border-top:1px solid var(--rule);margin-top:1.3rem}
.dossier{margin-top:0;border-top:1px solid var(--hair);font-size:inherit}
.dossier:first-of-type{border-top:0}
.dossier summary{font-style:normal;color:var(--ink);padding-block:.6rem;list-style:none}
.dossier summary::-webkit-details-marker{display:none}
.dossier summary b{display:block;font-family:var(--display);font-weight:500;font-size:1.25rem;line-height:1.15}
.dossier summary span{display:block;font-size:1.04rem;color:var(--ink-soft)}
.dossier summary b::after{content:" +";color:var(--spot)}
.dossier[open] summary b::after{content:" −"}
.dossier ol{list-style:none;margin:0 0 .8rem;padding:0 0 0 .9rem;border-left:1px solid var(--rule)}
.dossier li{font-size:1.02rem;margin-bottom:.35rem}
.dossier li i{color:var(--spot);font-style:normal;font-variant:small-caps;letter-spacing:.04em;margin-right:.4rem}
.look{margin:.6rem 0 0;padding-left:1.2rem}
.look li{margin-bottom:.3rem}
.field{margin-top:.8rem}
.field label{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
select{font:inherit;background:var(--paper);color:var(--ink);border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:.3rem 0;width:100%}
.stack{list-style:none;margin:0;padding:0}
.stack li{border-top:1px solid var(--hair);padding-block:.7rem;display:flex;gap:.8rem;align-items:baseline}
.stack li:first-child{border-top:0}
.stack a{flex:1;min-width:0;text-decoration:none}
.stack a b{display:block;font-family:var(--display);font-weight:500;font-size:1.2rem;line-height:1.15}
.stack a span{font-style:italic;color:var(--ink-soft);font-size:.98rem}
.stack button{font:inherit;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--ink-soft);border:1px solid var(--hair);padding:.3rem .5rem;border-radius:0;cursor:pointer;white-space:nowrap}
.lettre{padding-block:1.3rem;border-bottom:1px solid var(--rule);font-style:italic;font-size:1.2rem;line-height:1.5}
.lettre p+p{margin-top:.6rem}
.lettre .sig{text-align:right;font-family:var(--display);font-style:italic;margin-top:.8rem}
.epi{text-align:center;font-style:italic;padding-block:1rem;border-bottom:1px solid var(--rule);font-size:1.12rem;line-height:1.4}
.epi small{display:block;font-style:normal;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:.4rem}
.taste{display:flex;gap:.5rem;margin-top:.7rem}
.taste button{font:inherit;font-style:italic;font-size:.92rem;background:transparent;color:var(--ink-soft);border:1px solid var(--hair);border-radius:0;padding:.25rem .7rem;cursor:pointer}
.taste button.on{background:var(--spot);border-color:var(--spot);color:var(--paper)}
.feuil{border-block:3px double var(--rule);padding-block:1.2rem;margin-bottom:1.5rem}
.feuil h3{font-family:var(--display);font-size:1.6rem;line-height:1.1;margin:.3rem 0 .1rem;text-align:center}
.feuil .ep{text-align:center;font-style:italic;color:var(--ink-soft);margin-bottom:.9rem}
.feuil .seguira{text-align:right;font-style:italic;margin-top:.8rem}
.kiosk li{margin-bottom:.7rem}
.kiosk li a{font-family:var(--display);font-size:1.12rem;line-height:1.2;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
.kiosk li small{display:block;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--spot);margin-top:.1rem}
.kiosk li span{display:block;font-size:1.02rem}
.poste{border:1px solid var(--rule);background:var(--wash);padding:1rem .9rem 1.1rem}
.grille{height:4.6rem;border:1px solid var(--rule);background-image:radial-gradient(var(--ink) 1.1px,transparent 1.3px);background-size:7px 7px;background-color:var(--paper);opacity:.75}
.cadran{position:relative;border:1px solid var(--rule);background:var(--paper);margin-top:.8rem;padding:.5rem 0 .3rem;overflow:hidden}
.cadran .villes{display:flex;justify-content:space-between;gap:.25rem;white-space:nowrap;padding-inline:.5rem;font-size:.5rem;letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:lining-nums}
.cadran .ticks{height:.9rem;margin:.3rem .5rem 0;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px)}
.cadran .band{display:flex;justify-content:space-between;padding-inline:.5rem;font-size:.6rem;color:var(--ink-soft);font-variant-numeric:lining-nums;letter-spacing:.06em}
.aiguille{position:absolute;top:0;bottom:0;width:2px;background:#b3261e;left:4%;transition:left .7s cubic-bezier(.3,.8,.3,1)}
.voyant{display:flex;align-items:center;gap:.6rem;margin-top:.8rem;min-height:2.6rem}
.voyant .lampe{width:.7rem;height:.7rem;border-radius:50%;border:1px solid var(--rule);background:transparent;flex:none}
.voyant.on .lampe{background:#d98a1c;box-shadow:0 0 6px #d98a1c}
.voyant p{flex:1;min-width:0;font-size:1.02rem;line-height:1.25}
.voyant b{font-family:var(--display);font-weight:500;font-size:1.15rem}
.voyant button{font:inherit;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:0;padding:.45rem .7rem;cursor:pointer}
.ondes{margin-top:1.3rem}
.ondes h3{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--spot);font-family:var(--text);margin:1.1rem 0 .1rem}
.ondes a{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;text-decoration:none;border-top:1px solid var(--hair);padding:.6rem 0}
.ondes a b{font-family:var(--display);font-weight:500;font-size:1.2rem}
.ondes a span{font-style:italic;color:var(--ink-soft);font-size:.98rem;text-align:right}
.ondes a.on b{color:#b3261e}
@media (prefers-reduced-motion:reduce){.aiguille{transition:none}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.chips button{font:inherit;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:0;padding:.4rem .7rem;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--paper)}
.bibl li{display:block}
.bibl a .ex{display:block;font-style:normal;font-size:1rem;color:var(--ink);margin-top:.2rem}
.bibl a.lu b{color:var(--ink-soft)}
.bibl a.lu b::after{content:" ✓";color:var(--spot);font-family:var(--text);font-size:.9rem}
.bibl details{border-top:1px solid var(--rule);margin-top:0}
.bibl summary{font-style:normal;color:var(--ink);padding-block:.8rem;list-style:none}
.bibl summary::-webkit-details-marker{display:none}
.bibl summary b{display:block;font-family:var(--display);font-weight:500;font-size:1.45rem;line-height:1.15}
.bibl summary span{font-style:italic;color:var(--ink-soft)}
.body h3{font-family:var(--display);font-size:1.3rem;line-height:1.2;margin:1.4rem 0 .5rem;text-indent:0}
.credit{border-top:1px solid var(--rule);margin-top:1.6rem;padding-top:.8rem;font-size:.98rem;color:var(--ink-soft)}
.shelfcard{display:block;text-decoration:none;border-block:1px solid var(--rule);padding-block:.8rem;margin-top:1.2rem}
.shelfcard b{display:block;font-family:var(--display);font-weight:500;font-size:1.3rem}
.shelfcard span{font-style:italic;color:var(--ink-soft)}
.sec{border-top:1px solid var(--hair);padding-block:1rem}
.sec .ref{font-size:.74rem;letter-spacing:.14em;color:var(--spot);font-variant-numeric:lining-nums}
.sec .gr{font-size:1.32rem;line-height:1.6;margin-top:.2rem}
.sec .tr,.sec .trf{font-size:1.05rem;color:var(--ink-soft);margin-top:.6rem;border-left:1px solid var(--rule);padding-left:.8rem}
.sec .trf{color:var(--ink);font-style:italic}
.trbar{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.trbar button,.alltr{font:inherit;font-style:italic;font-size:.92rem;background:transparent;color:var(--ink-soft);border:1px solid var(--hair);border-radius:0;padding:.25rem .7rem;cursor:pointer}
.salle{border-top:1px solid var(--rule);margin-top:0}
.salle summary{list-style:none;padding-block:.9rem;font-style:normal;color:var(--ink);display:grid;grid-template-columns:2.4rem 1fr;gap:.2rem .6rem;align-items:baseline}
.salle summary::-webkit-details-marker{display:none}
.salle summary i{font-family:var(--display);font-style:normal;font-size:1.1rem;color:var(--spot)}
.salle summary b{font-family:var(--display);font-weight:500;font-size:1.45rem;line-height:1.12}
.salle summary span{grid-column:2;font-style:italic;color:var(--ink-soft)}

.work{margin:1.4rem 0 0}

  if(!window.claude||!window.claude.use)return;
  window.claude.use("sample").then(function(s){sample=s;if(s&&E)showButtons()});
  var done=false, timer=setTimeout(function(){if(!done){var w=$("wait");if(w)w.textContent="L'édition tarde à arriver. Vérifiez la connexion, puis rouvrez la page."}},10000);
  window.claude.use("db").then(function(d){
    if(!d){done=true;clearTimeout(timer);var w0=$("wait");if(w0)w0.textContent="Ouvrez cette page avec votre compte Claude pour lire l'édition du jour.";return}
    db=d;
    db.doc("reglages/lecteur").get().then(function(s){if(s.exists){lieu=(s.data()||{}).lieu||"";var el=$("lieu");if(el&&!el.value&&lieu){el.value=lieu;el.dispatchEvent(new Event("change"))}}}).catch(function(){});
    db.collection("pile").orderBy("ajoute","desc").limit(60).onSnapshot(function(s){pileReady=true;PILE=s.docs.map(function(x){var o=x.data()||{};return {id:x.id,titre:o.titre,source:o.source,langue:o.langue,texte:o.texte}});drawPile()},function(){pileReady=true;drawPile()});
    db.collection("depeches").orderBy("date","desc").limit(1).onSnapshot(function(s){DEP=s.empty?null:(s.docs[0].data()||null);drawDep()},function(){});
    db.collection("musee").orderBy("ordre").onSnapshot(function(s){MUS=s.docs.map(function(x){return x.data()||{}});drawMus()},function(){});
    db.collection("catalogue").onSnapshot(function(s){catReady=true;CAT=[];s.docs.forEach(function(x){((x.data()||{}).items||[]).forEach(function(i){CAT.push(i)})});drawBib();if($("v-lire")&&!$("v-lire").hidden)drawLire()},function(){catReady=true;drawBib()});
    drawPile();loadImage();
    db.collection("editions").orderBy("date","desc").limit(1).onSnapshot(function(snap){
      if(snap.empty){if(!snap.metadata.fromCache){done=true;clearTimeout(timer)}return}
      done=true;clearTimeout(timer);show(snap.docs[0].data(),false);
    },function(){done=true;clearTimeout(timer);var w=$("wait");if(w)w.textContent="L'édition n'a pas pu être chargée."});
  });
}
start();
})();
</script>
